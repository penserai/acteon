title = "Acteon source secret scanning"
[extend]
useDefault = true

[[allowlists]]
description = "Documented non-credential deduplication and grouping identifiers"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
    '''crates/simulation/examples/dynamodb_simulation\.rs$''',
    '''docs/book/admin-ui/operations\.md$''',
    '''docs/book/features/swarm-provider\.md$''',
]
regexTarget = "match"
regexes = ['''(dedup_key|group_key|idempotency_key)''']

[[allowlists]]
description = "Exact incomplete tokens and dummy credentials in named documentation examples"
targetRules = ["generic-api-key", "curl-auth-header"]
condition = "AND"
paths = [
    '''docs/book/api/authentication\.md$''',
    '''docs/book/features/payload-encryption\.md$''',
    '''docs/book/guides/agent-swarm-coordination\.md$''',
    '''examples/alertmanager-sample\.yml$''',
]
regexTarget = "match"
regexes = [
    '''your-api-key''', '''agent-researcher-key''',
    '''eyJhbGciOiJIUzI1NiIs\.\.\.''', '''a1b2c3d4e5f6\.\.\.''',
    '''abc123def456''',
]

[[allowlists]]
description = "Exact SHA-256 of the documented public local policy-demo key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
    '''docs/book/guides/agent-swarm-coordination\.md$''',
    '''examples/agent-swarm-coordination/policy-demo/auth\.toml$''',
]
regexTarget = "match"
regexes = ['''key_hash\s*=\s*"e5522a60c16c993c80c7c251fe4dc4ad5f1de7926c57ec5401d3d42891633ad8"''']

[[allowlists]]
description = "Environment variable references for receipt keys; no credential values"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
    '''crates/server/tests/reconciliation_config\.rs$''',
    '''docs/book/features/governance\.md$''',
]
regexTarget = "match"
regexes = ['''secret_env"?\s*[:=]\s*"ACTEON_FINALITY_[A-Z0-9_]+"''']
