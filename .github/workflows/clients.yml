name: Client release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - run: ruff check . && ruff format --check . && mypy acteon_client
      - run: pytest -q
      - run: python -m build
      - name: Install the wheel into an isolated environment
        run: |
          python -m venv /tmp/acteon-wheel
          /tmp/acteon-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/acteon-wheel/bin/python -c 'from acteon_client import ActeonClient'
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: clients/nodejs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/nodejs/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm run package:check
      - run: npm audit --audit-level=high
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum
      - run: cd clients/go && go test -race ./... && go vet ./...
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.5.1'
      - run: cd clients/java && gradle test build --no-daemon
