name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

# `acteon-bus` brings in `rdkafka-sys` 4.10 which vendors librdkafka
# 2.12.1 and builds it statically through `cmake-build`. librdkafka
# 2.12.1 has a regression where rdkafka_conf.c includes curl/curl.h
# unconditionally even when `-DWITH_CURL=0` is passed, so the build
# fails on runners that don't have libcurl headers. Every Rust job
# that compiles the workspace needs them.

# The consolidated dependency PR runs the required non-Docker checks on the
# self-hosted Mac so their branch-protection contexts remain present without
# using hosted runner minutes.
jobs:
  check:
    name: "Check (${{ matrix.rust }})"
    runs-on: ${{ github.head_ref == 'codex/consolidated-build-deps' && fromJSON('["self-hosted","macOS","X64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install librdkafka build deps
        if: github.head_ref != 'codex/consolidated-build-deps'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.head_ref != 'codex/consolidated-build-deps'
      - run: cargo check --locked --workspace --all-targets

  clippy:
    name: "Clippy (${{ matrix.rust }})"
    runs-on: ${{ github.head_ref == 'codex/consolidated-build-deps' && fromJSON('["self-hosted","macOS","X64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install librdkafka build deps
        if: github.head_ref != 'codex/consolidated-build-deps'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.head_ref != 'codex/consolidated-build-deps'
      - run: cargo clippy --locked --workspace --no-deps -- -D warnings

  test:
    name: "Test (${{ matrix.rust }})"
    runs-on: ${{ github.head_ref == 'codex/consolidated-build-deps' && fromJSON('["self-hosted","macOS","X64"]') || 'ubuntu-latest' }}
    env:
      CARGO_PROFILE_DEV_DEBUG: ${{ github.head_ref == 'codex/consolidated-build-deps' && '0' || '2' }}
      CARGO_PROFILE_TEST_DEBUG: ${{ github.head_ref == 'codex/consolidated-build-deps' && '0' || '2' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job builds the full workspace with debug info plus the cloud
      # provider feature matrices; the runner's default free space is no
      # longer enough and the linker dies with SIGBUS at 0 MB free.
      # Reclaim ~25 GB by dropping preinstalled toolchains we never use.
      - name: Free disk space
        if: github.head_ref != 'codex/consolidated-build-deps'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install librdkafka build deps
        if: github.head_ref != 'codex/consolidated-build-deps'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.head_ref != 'codex/consolidated-build-deps'
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # nextest
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --lib --bins --tests
      - name: Verify documented quick start
        if: matrix.rust == 'stable'
        run: |
          cargo build --locked -p acteon-server
          python3 scripts/ci/quickstart.py --server target/debug/acteon-server
          python3 scripts/ci/agent_guide.py --server target/debug/acteon-server
          python3 scripts/sdk/platform_catalog.py --check
          python3 scripts/ci/route_permissions.py
      - name: Verify neural observability platform adapters
        run: |
          cargo test --locked -p acteon-simulation --features bus,redis --example neural_observability_simulation
          cargo test --locked -p acteon-client --features stream-processing --lib
      - name: Test AWS providers
        run: cargo nextest run --locked -p acteon-aws --features full --lib --tests
      - name: Test Azure providers
        run: cargo nextest run --locked -p acteon-azure --features full --lib --tests
      - name: Test GCP providers
        run: cargo nextest run --locked -p acteon-gcp --features full --lib --tests
      - name: Build server with opt-in messaging providers
        run: cargo check --locked -p acteon-server --features extras-alerting
      - name: Run doctests
        run: cargo test --locked --workspace --doc

  fmt:
    name: Format
    runs-on: ${{ github.head_ref == 'codex/consolidated-build-deps' && fromJSON('["self-hosted","macOS","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  documentation:
    if: github.head_ref != 'codex/consolidated-build-deps'
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  frontend:
    name: Frontend
    runs-on: ${{ github.head_ref == 'codex/consolidated-build-deps' && fromJSON('["self-hosted","macOS","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci
      - run: cd ui && npm run lint
      - run: cd ui && npm run build
      - run: cd ui && npm audit --audit-level=high
      - run: cd ui && npx playwright install --with-deps chromium
        if: github.head_ref != 'codex/consolidated-build-deps'
      - run: cd ui && npx playwright install chromium
        if: github.head_ref == 'codex/consolidated-build-deps'
      - run: cd ui && npm run test:smoke
      - name: Governed agent task browser contract
        run: cd ui && ACTEON_UI_TEST_PORT=5184 npx playwright test agent-services.spec.ts --project=chromium --project=mobile-chrome --reporter=line
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            ui/playwright-report
            ui/test-results

  doc:
    name: Doc
    runs-on: ${{ github.head_ref == 'codex/consolidated-build-deps' && fromJSON('["self-hosted","macOS","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install librdkafka build deps
        if: github.head_ref != 'codex/consolidated-build-deps'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.head_ref != 'codex/consolidated-build-deps'
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  tla-specs:
    if: github.head_ref != 'codex/consolidated-build-deps'
    name: TLA+ Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Model-check concurrency specs with TLC
        run: ./specs/tla/ci/run-tlc.sh

  kafka:
    if: github.head_ref != 'codex/consolidated-build-deps'
    name: Kafka conformance (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ACTEON_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.head_ref != 'codex/consolidated-build-deps'
      - name: Run real-broker and transport recovery tests
        run: |
          test -n "$ACTEON_KAFKA_BOOTSTRAP"
          cargo test --locked -p acteon-bus --lib --tests
          cargo test --locked -p acteon-server --features bus --test bus_session_tests --test bus_stage_tests
      - name: Kafka broker logs
        if: always()
        run: docker logs "${{ job.services.kafka.id }}"

  integration:
    if: github.head_ref != 'codex/consolidated-build-deps'
    name: Integration (stable)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acteon
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: acteon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acteon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://acteon:ci-local-only@localhost:5432/acteon_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: github.head_ref != 'codex/consolidated-build-deps'
      - run: cargo test --locked -p acteon-state-redis -p acteon-state-postgres --features integration --lib
      - name: Governance coordinator multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test coordinator independent_redis_connections_pass_the_same_contract -- --ignored
      - name: Governance context multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test context independent_redis_context_capture_and_recovery -- --ignored
      - name: Governance root reservations multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test reservations independent_redis_root_reservations_pass_the_contract -- --ignored
      - name: Governance current permits multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test permits independent_redis_current_permits_pass_the_contract -- --ignored
      - name: Governance configuration snapshots multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test configurations independent_redis_configuration_snapshots_pass_the_contract -- --ignored
      - name: Evaluated governance control multi-client backend contracts
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test control -- --include-ignored
      - name: Workforce authority multi-client state backend contracts
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test workforce -- --include-ignored
      - name: Server authentication with memory and no Redis feature
        run: cargo test --locked -p acteon-server --no-default-features --test auth_authority real_memory_server_uses_the_configured_state_backend
      - name: Private final-work admission with memory and no Redis feature
        run: cargo test --locked -p acteon-server --no-default-features --test execution_preparation
      - name: Governed HTTP dispatch with memory and no Redis feature
        run: cargo test --locked -p acteon-server --no-default-features --test execution_http
      - name: Current authenticated governance management
        run: cargo test --locked -p acteon-server --no-default-features --test execution_management
      - name: Run the documented governed city with no Redis dependency
        run: |
          python3 -m venv /tmp/acteon-city-ci
          /tmp/acteon-city-ci/bin/pip install -e clients/python
          /tmp/acteon-city-ci/bin/python examples/governed-city/run.py --server target/debug/acteon-server --output /tmp/governed-city-results.json
          /tmp/acteon-city-ci/bin/python examples/agent-workforce/run.py --server target/debug/acteon-server --output /tmp/agent-workforce-results.json
      - name: Save governed city runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-city-evidence
          path: |
            /tmp/governed-city-results.json
            /tmp/agent-workforce-results.json
      - name: Server authentication authority and startup Redis contracts
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-server --test auth_authority authentication -- --ignored
      - name: Root admission multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-server --test execution_preparation independent_redis_root_admission_passes_the_contract -- --ignored
      - name: Registry mutation multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test registry_mutations -- --ignored
      - name: Governance credential authority multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test credentials independent_redis_credential_authority_passes_the_contract -- --ignored
      - name: Durable provider multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-executor --test governed_provider independent_redis_workers_observe_one_provider_attempt -- --ignored
      - name: Durable individual-agent runtime multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-gateway --test agent_runtime independent_redis_runtime_recovers_lost_acceptance_and_known_or_uncertain_results -- --ignored
      - name: Authenticated agent services restart, ambiguity and storage contracts
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-server --test agent_services_http -- --ignored
      - name: Cross-principal delegation multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-governance --test cross_principal independent_redis_delegation_sponsorship_and_retirement -- --ignored
      - name: Approved peer discovery multi-client Redis contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-executor --test delegation_discovery independent_redis_clients_discover_only_current_credentialed_peers -- --ignored
      - name: Qualified plan multi-client Redis handoff contract
        env:
          ACTEON_GOVERNANCE_REDIS_URL: redis://localhost:6379
        run: cargo test --locked -p acteon-executor --test qualified_plans independent_redis_qualified_handoff_contract -- --ignored
      - name: Durable provider multi-client PostgreSQL contract
        run: cargo test --locked -p acteon-executor --test governed_provider independent_postgres_workers_observe_one_provider_attempt -- --ignored
      - name: Qualified plan multi-client PostgreSQL handoff contract
        run: cargo test --locked -p acteon-executor --test qualified_plans independent_postgres_qualified_handoff_contract -- --ignored
      - name: Server authentication authority and startup PostgreSQL contract
        run: cargo test --locked -p acteon-server --features postgres --test auth_authority independent_postgres_authentication_replicas_pass_the_contract -- --ignored
      - name: Root admission multi-client PostgreSQL contract
        run: cargo test --locked -p acteon-server --features postgres --test execution_preparation independent_postgres_root_admission_passes_the_contract -- --ignored
      - name: Authenticated workforce admission with PostgreSQL and no Redis feature
        run: cargo test --locked -p acteon-server --no-default-features --features postgres --test execution_preparation independent_postgres_authenticated_workforce_passes_the_contract -- --ignored
      - name: Governed HTTP dispatch survives PostgreSQL server restart
        run: cargo test --locked -p acteon-server --no-default-features --features postgres --test execution_http -- --include-ignored
      - name: PostgreSQL audit-store conformance
        run: cargo test --locked -p acteon-audit-postgres --features integration --lib
      - name: Start disposable DynamoDB
        run: docker run -d --name acteon-ci-dynamodb -p 127.0.0.1:8000:8000 amazon/dynamodb-local:3.3.0 -jar DynamoDBLocal.jar -inMemory -sharedDb
      - name: DynamoDB state and lock conformance
        run: cargo test --locked -p acteon-state-dynamodb --features integration --lib
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: Server authentication authority and startup DynamoDB contract
        run: cargo test --locked -p acteon-server --features dynamodb --test auth_authority independent_dynamodb_authentication_replicas_pass_the_contract -- --ignored
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: Root admission multi-client DynamoDB contract
        run: cargo test --locked -p acteon-server --features dynamodb --test execution_preparation independent_dynamodb_root_admission_passes_the_contract -- --ignored
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: Durable provider multi-client DynamoDB contract
        run: cargo test --locked -p acteon-executor --features dynamodb --test governed_provider independent_dynamodb_workers_observe_one_provider_attempt -- --ignored
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: Qualified plan multi-client DynamoDB handoff contract
        run: cargo test --locked -p acteon-executor --features dynamodb --test qualified_plans independent_dynamodb_qualified_handoff_contract -- --ignored
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: DynamoDB audit-store conformance
        run: cargo test --locked -p acteon-audit-dynamodb --features integration --lib
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: cargo test --locked -p acteon-simulation --features swarm,redis,postgres --lib
