name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

# `acteon-bus` brings in `rdkafka-sys` 4.10 which vendors librdkafka
# 2.12.1 and builds it statically through `cmake-build`. librdkafka
# 2.12.1 has a regression where rdkafka_conf.c includes curl/curl.h
# unconditionally even when `-DWITH_CURL=0` is passed, so the build
# fails on runners that don't have libcurl headers. Every Rust job
# that compiles the workspace needs them.

jobs:
  check:
    name: "Check (${{ matrix.rust }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --workspace --all-targets

  clippy:
    name: "Clippy (${{ matrix.rust }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --workspace --no-deps -- -D warnings

  test:
    name: "Test (${{ matrix.rust }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This job builds the full workspace with debug info plus the cloud
      # provider feature matrices; the runner's default free space is no
      # longer enough and the linker dies with SIGBUS at 0 MB free.
      # Reclaim ~25 GB by dropping preinstalled toolchains we never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # nextest
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --lib --bins --tests
      - name: Verify documented quick start
        if: matrix.rust == 'stable'
        run: |
          cargo build --locked -p acteon-server
          python3 scripts/ci/quickstart.py --server target/debug/acteon-server
      - name: Test AWS providers
        run: cargo nextest run --locked -p acteon-aws --features full --lib --tests
      - name: Test Azure providers
        run: cargo nextest run --locked -p acteon-azure --features full --lib --tests
      - name: Test GCP providers
        run: cargo nextest run --locked -p acteon-gcp --features full --lib --tests
      - name: Build server with opt-in messaging providers
        run: cargo check --locked -p acteon-server --features extras-alerting
      - name: Run doctests
        run: cargo test --locked --workspace --doc

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci
      - run: cd ui && npm run lint
      - run: cd ui && npm run build
      - run: cd ui && npm audit --audit-level=high
      - run: cd ui && npx playwright install --with-deps chromium
      - run: cd ui && npm run test:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            ui/playwright-report
            ui/test-results

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  tla-specs:
    name: TLA+ Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Model-check concurrency specs with TLC
        run: ./specs/tla/ci/run-tlc.sh

  kafka:
    name: Kafka conformance (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ACTEON_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run real-broker and transport recovery tests
        run: |
          test -n "$ACTEON_KAFKA_BOOTSTRAP"
          cargo test --locked -p acteon-bus --lib --tests
      - name: Kafka broker logs
        if: always()
        run: docker logs "${{ job.services.kafka.id }}"

  integration:
    name: Integration (stable)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acteon
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: acteon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acteon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://acteon:ci-local-only@localhost:5432/acteon_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked -p acteon-state-redis -p acteon-state-postgres --features integration --lib
      - name: PostgreSQL audit-store conformance
        run: cargo test --locked -p acteon-audit-postgres --features integration --lib
      - name: Start disposable DynamoDB
        run: docker run -d --name acteon-ci-dynamodb -p 127.0.0.1:8000:8000 amazon/dynamodb-local:3.3.0 -jar DynamoDBLocal.jar -inMemory -sharedDb
      - name: DynamoDB state and lock conformance
        run: cargo test --locked -p acteon-state-dynamodb --features integration --lib
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: DynamoDB audit-store conformance
        run: cargo test --locked -p acteon-audit-dynamodb --features integration --lib
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          AWS_ACCESS_KEY_ID: acteonlocaltest
          AWS_SECRET_ACCESS_KEY: acteon-local-test
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: cargo test --locked -p acteon-simulation --features swarm,redis,postgres --lib
      - name: Scenario CLI contracts
        run: cargo test --locked -p acteon-simulation --features swarm,redis,postgres --test scenario_cli
      - run: scripts/ci/scenarios.sh memory redis postgres
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scenario-evidence
          path: scenario-results
