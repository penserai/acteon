name: Dependency security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  audit:
    # Use the local Mac for trusted branches; fork PRs stay on hosted runners.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted","macOS","X64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.20.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install Gitleaks from its Go module
        run: |
          GOBIN="$RUNNER_TEMP/gitleaks-bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: scripts/ci/security.sh
      - run: cargo deny --locked check licenses sources
      - run: scripts/ci/secrets.sh
      - name: Save dependency inventory
        if: always()
        run: |
          mkdir -p dependency-evidence
          cargo metadata --locked --format-version 1 > dependency-evidence/cargo-metadata.json
          cargo audit --json > dependency-evidence/rustsec.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-evidence
          path: dependency-evidence
