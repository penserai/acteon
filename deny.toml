[graph]
all-features = true

# Explicit permissive license policy. Unknown/nonmatching licenses require review.
[licenses]
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "Zlib",
    "CC0-1.0", "Unicode-3.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
