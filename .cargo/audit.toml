# sqlx's lockfile contains its optional MySQL/RSA and SQLite dependency graphs.
# Acteon only compiles PostgreSQL; scripts/ci/security.sh verifies RSA and
# libsqlite3-sys remain unreachable.
# No RSA private-key or SQLite operation is authorized by this exception.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]
