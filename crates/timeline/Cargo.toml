[package]
name = "acteon-timeline"
description = "Tenant event projections and durable CDC ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
bus = ["dep:acteon-bus", "dep:futures"]
archive = ["dep:futures", "dep:parquet", "dep:object_store", "dep:bytes"]

[dependencies]
acteon-core.workspace = true
acteon-rules.workspace = true
acteon-rules-cel.workspace = true
acteon-state.workspace = true
acteon-bus = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
thiserror.workspace = true
reqwest.workspace = true
base64.workspace = true
uuid.workspace = true
tracing.workspace = true
fs2 = "0.4"
unicode-segmentation = "1.12"
parquet = { version = "56", default-features = false, features = ["zstd"], optional = true }
object_store = { version = "0.14.2", features = ["aws"], optional = true }
futures = { workspace = true, optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
acteon-state-memory.workspace = true
tempfile = "3"

[lints]
workspace = true
